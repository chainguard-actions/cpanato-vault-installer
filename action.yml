# action.yml
name: vault-installer
author: cpanato
description: 'Installs Hashicorp Vault and includes it in your path'
branding:
  icon: 'package'
  color: 'blue'
# This is pinned to the last major release, we have to bump it for each action version.
inputs:
  vault-release:
    description: 'Hashicorp Vault release version to be installed'
    required: false
    default: '1.21.2'
  install-dir:
    description: 'Where to install the Hashicorp Vault binary'
    required: false
    default: '$HOME/.vault'
  use-sudo:
    description: 'set to true if install-dir location requires sudo privs'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    # We verify the version against a SHA **in the published action itself**, not in the GCS bucket.
    - shell: bash
      env:
        INPUT_VAULT_RELEASE: ${{ inputs.vault-release }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        INPUT_USE_SUDO: ${{ inputs.use-sudo }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        #!/bin/bash
        # vault install script
        shopt -s expand_aliases
        if [ -z "$NO_COLOR" ]; then
          alias log_info="echo -e \"\033[1;32mINFO\033[0m:\""
          alias log_error="echo -e \"\033[1;31mERROR\033[0m:\""
        else
          alias log_info="echo \"INFO:\""
          alias log_error="echo \"ERROR:\""
        fi
        set -e

        # Expand a leading $HOME / ${HOME} / ~ (the default is '$HOME/.vault'),
        # without evaluating anything else in the value.
        INSTALL_DIR="$INPUT_INSTALL_DIR"
        case "$INSTALL_DIR" in
          '$HOME'|'$HOME/'*) INSTALL_DIR="${HOME}${INSTALL_DIR:5}" ;;
          '${HOME}'|'${HOME}/'*) INSTALL_DIR="${HOME}${INSTALL_DIR:7}" ;;
          '~'|'~/'*) INSTALL_DIR="${HOME}${INSTALL_DIR:1}" ;;
        esac
        VAULT_RELEASE="$INPUT_VAULT_RELEASE"

        semver='^([0-9]+\.){0,2}(\*|[0-9]+)$'
        if [[ ! "$VAULT_RELEASE" =~ $semver ]]; then
          log_error "Unable to validate requested Hashicorp Vault version: '${VAULT_RELEASE}'"
          exit 1
        fi

        mkdir -p "$INSTALL_DIR"

        shaprog() {
          case "$RUNNER_OS_NAME" in
            Linux)
              sha256sum --ignore-missing --check "$2"
              ;;
            macOS)
              shasum -a256 --ignore-missing --check "$2"
              ;;
            Windows)
              powershell -command "(Get-FileHash $1 -Algorithm SHA256 | Select-Object -ExpandProperty Hash).ToLower() -eq (Get-Content $2)"
              ;;
            *)
              log_error "unsupported OS ${RUNNER_OS_NAME}"
              exit 1
              ;;
          esac
        }

        trap "popd >/dev/null" EXIT

        pushd "$INSTALL_DIR" > /dev/null

        case "$RUNNER_OS_NAME" in
          Linux)
            case "$RUNNER_ARCH_NAME" in
              X64)
                desired_vault_filename="vault_${VAULT_RELEASE}_linux_amd64.zip"
                ;;

              ARM)
                desired_vault_filename="vault_${VAULT_RELEASE}_linux_arm.zip"
                ;;

              ARM64)
                desired_vault_filename="vault_${VAULT_RELEASE}_linux_arm64.zip"
                ;;

              *)
                log_error "unsupported architecture $arch"
                exit 1
                ;;
            esac
            ;;

          macOS)
            case "$RUNNER_ARCH_NAME" in
              X64)
                desired_vault_filename="vault_${VAULT_RELEASE}_darwin_amd64.zip"
                ;;

              ARM64)
                desired_vault_filename="vault_${VAULT_RELEASE}_darwin_arm64.zip"
                ;;

              *)
                log_error "unsupported architecture $arch"
                exit 1
                ;;
            esac
            ;;

          Windows)
            case "$RUNNER_ARCH_NAME" in
              X64)
                desired_vault_filename="vault_${VAULT_RELEASE}_windows_amd64.zip"
                ;;
              *)
                log_error "unsupported architecture $arch"
                exit 1
                ;;
            esac
            ;;
          *)
            log_error "unsupported architecture $arch"
            exit 1
            ;;
        esac

        SUDO=
        if [ "$INPUT_USE_SUDO" = "true" ] && command -v sudo >/dev/null; then
          SUDO=sudo
        fi

        log_info "Hashicorp Vault version '${VAULT_RELEASE}' requested"

        # Download custom Hashicorp Vault
        log_info "Downloading platform-specific version '${VAULT_RELEASE}' of vault...\n      https://releases.hashicorp.com/vault/${VAULT_RELEASE}/${desired_vault_filename}"
        $SUDO curl -sL "https://releases.hashicorp.com/vault/${VAULT_RELEASE}/${desired_vault_filename}" -o "${desired_vault_filename}"
        $SUDO curl -sL "https://releases.hashicorp.com/vault/${VAULT_RELEASE}/vault_${VAULT_RELEASE}_SHA256SUMS" -o SHA256SUMS
        if [[ "$RUNNER_OS_NAME" == "Windows" ]]; then
          log_info "Im running here '${RUNNER_OS_NAME}'"
          filesha256=$(cat SHA256SUMS | grep "${desired_vault_filename}" | cut -d' ' -f1)
          echo "$filesha256" > .expected-hash.sha256
          cat .expected-hash.sha256
          shaprog "${desired_vault_filename}" .expected-hash.sha256
        else
          log_info "Im running here without windows '${RUNNER_OS_NAME}'"
          shaprog "${desired_vault_filename}" SHA256SUMS
        fi

        ret=$?
        if [[ $retVal -eq 0 ]]; then
          log_info "unpacking!"
          $SUDO unzip "${desired_vault_filename}" -d "${INSTALL_DIR}"
          $SUDO rm -f SHA256SUMS
          $SUDO rm -f "${desired_vault_filename}"
          log_info "Installation complete!"
        else
          log_error "Unable to validate vault version: '${VAULT_RELEASE}'"
          exit 1
        fi
    - if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
      env:
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        INSTALL_DIR="$INPUT_INSTALL_DIR"
        case "$INSTALL_DIR" in
          '$HOME'|'$HOME/'*) INSTALL_DIR="${HOME}${INSTALL_DIR:5}" ;;
          '${HOME}'|'${HOME}/'*) INSTALL_DIR="${HOME}${INSTALL_DIR:7}" ;;
          '~'|'~/'*) INSTALL_DIR="${HOME}${INSTALL_DIR:1}" ;;
        esac
        safe=$(printf '%s' "$INSTALL_DIR" | tr -d '\n\r')
        printf '%s\n' "$safe" >> "$GITHUB_PATH"
      shell: bash
    - if: ${{ runner.os == 'Windows' }}
      env:
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        $dir = $env:INPUT_INSTALL_DIR
        if ($dir -eq '$HOME' -or $dir.StartsWith('$HOME/') -or $dir.StartsWith('$HOME\')) {
          $dir = $HOME + $dir.Substring(5)
        } elseif ($dir -eq '${HOME}' -or $dir.StartsWith('${HOME}/') -or $dir.StartsWith('${HOME}\')) {
          $dir = $HOME + $dir.Substring(7)
        }
        $dir = $dir -replace "[`r`n]", ''
        echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
